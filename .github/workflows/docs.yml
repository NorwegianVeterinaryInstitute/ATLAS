name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      # 1 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2 Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      # 3 Generate script help pages from -h output
      - name: Generate script help
        run: bash .github/scripts/gen_help.sh

      # 4 Build site (fails if a help snippet is missing)
      - name: Build site
        run: uvx zensical build --clean

      # 5 Upload site for deployment
      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
