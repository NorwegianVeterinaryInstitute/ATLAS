name: Shell Lint and Syntax Check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  lint:
    name: Lint Bash scripts with ShellCheck + Syntax Check
    runs-on: ubuntu-latest

    steps:
      # 1️ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️ Install ShellCheck
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # 3️ Set up reviewdog
      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      # 4️ Run ShellCheck with reviewdog (inline PR comments)
      - name: Run ShellCheck with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running ShellCheck..."
          find . -type f -name "*.sh" \
            | xargs -I{} shellcheck {} -f gcc \
            | reviewdog -f=golint -name="ShellCheck" -reporter=github-pr-review -level=warning

      # 5️ Bash syntax check (fails workflow if syntax errors exist)
      - name: Bash syntax check
        run: |
          set -e  # stop on first failure
          echo "Running bash syntax checks..."
          for script in $(find . -type f -name "*.sh"); do
            echo "Checking syntax for $script"
            bash -n "$script"
          done
