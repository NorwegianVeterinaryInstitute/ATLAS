name: Shell Lint and Syntax Check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  lint:
    name: Lint Bash scripts with ShellCheck + Syntax Check
    runs-on: ubuntu-latest

    steps:
      # 1 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2 Install dependencies
      - name: Install dependencies
        run: 
          npm init
          npm install

      # 2 Install ShellCheck
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # 3 Set up reviewdog
      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      # 4 Run ShellCheck with reviewdog and fail on errors
      - name: Run ShellCheck with reviewdog
        uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          reporter: github-pr-review
          filter_mode: diff_context
          fail_level: error

      # 5 Bash syntax check (fail workflow on syntax errors)
      - name: Bash syntax check
        run: |
          set -e
          echo "Running bash syntax checks..."
          for script in $(find . -type f -name "*.sh"); do
            echo "Checking syntax for $script"
            bash -n "$script"
          done