name: Shell Lint and Syntax Check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  lint:
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    name: Lint Bash scripts with ShellCheck + Syntax Check
    runs-on: ubuntu-latest

    steps:
      # 1 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2 Install ShellCheck
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # 3 Set up reviewdog
      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      # 4 Run ShellCheck with reviewdog and fail on errors
      - name: Run ShellCheck with reviewdog
        uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          reporter: github-pr-review
          filter_mode: diff_context
          fail_level: error

      # 5 Bash syntax check (fail workflow on syntax errors)
      - name: Bash syntax check
        run: |
          set -e
          echo "Running bash syntax checks..."
          for script in $(find . -type f -name "*.sh"); do
            echo "Checking syntax for $script"
            bash -n "$script"
          done
          
      # 6 Shell builtins must not be called by path (e.g. /usr/bin/cd does nothing)
      - name: No path-qualified shell builtins
        run: |
          builtins=$(compgen -b | grep -vxF -e '[' -e '.' -e ':' | paste -sd'|')
          ! grep -nE "/(usr/)?bin/(${builtins})\b" scripts/*.sh etc/*.sh

  e2e:
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    name: End-to-end test on dummy data
    runs-on: ubuntu-latest

    steps:
      # 1 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2 Install script dependencies
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dos2unix rsync

      # 3 Run end-to-end test
      - name: Run e2e test
        run: bash tests/e2e.sh
