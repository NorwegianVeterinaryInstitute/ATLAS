name: Shell Lint and Syntax Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    name: Lint Bash scripts with ShellCheck + Syntax Check
    # Pinned: see the e2e job for why not ubuntu-latest.
    runs-on: ubuntu-24.04
    # reviewdog posts review comments with the built-in token.
    permissions:
      contents: read
      pull-requests: write

    steps:
      # 1 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2 Install ShellCheck
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # 3 Set up reviewdog
      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      # 4 Run ShellCheck with reviewdog and fail on errors
      - name: Run ShellCheck with reviewdog
        uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: diff_context
          fail_level: error

      # 5 Bash syntax check (fail workflow on syntax errors)
      - name: Bash syntax check
        run: |
          set -e
          echo "Running bash syntax checks..."
          for script in $(find . -type f -name "*.sh"); do
            echo "Checking syntax for $script"
            bash -n "$script"
          done

      # 6 Shell builtins must not be called by path (e.g. /usr/bin/cd does nothing)
      - name: No path-qualified shell builtins
        run: |
          builtins=$(compgen -b | grep -vxF -e '[' -e '.' -e ':' | paste -sd'|')
          ! grep -nE "/(usr/)?bin/(${builtins})\b" scripts/*.sh etc/*.sh

  e2e:
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    name: End-to-end test on dummy data
    # Pinned to 24.04: from 26.04 on, Ubuntu ships uutils (Rust) coreutils
    # instead of GNU. Its sha512sum reports version 0.x, which
    # scripts/check_dependencies.sh rejects against the GNU minimum (8.32).
    # Before moving to a newer image, teach the check about uutils and
    # confirm it behaves like GNU coreutils for our use.
    runs-on: ubuntu-24.04

    steps:
      # 1 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2 Install script dependencies
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dos2unix rsync

      # 3 Run end-to-end test
      - name: Run e2e test
        run: bash tests/e2e.sh
