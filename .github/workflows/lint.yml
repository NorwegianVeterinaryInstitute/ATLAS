name: Shell Lint and Syntax Check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  lint:
    name: Lint Bash scripts with ShellCheck + Syntax Check
    runs-on: ubuntu-latest

    steps:
      # 1️ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 Install ShellCheck
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # 3 Set up reviewdog
      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      # 4 Run ShellCheck on all scripts and post inline comments
      - name: Run ShellCheck with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          echo "Running ShellCheck on all scripts..."
          # Use checkstyle format so reviewdog can parse all lines
          find . -type f -name "*.sh" \
            | xargs -I{} shellcheck {} -f checkstyle \
            | reviewdog -f=checkstyle -name="ShellCheck" -reporter=github-pr-review -level=error

      # 5 Bash syntax check (fail workflow on errors)
      - name: Bash syntax check
        run: |
          set -e
          echo "Running bash syntax checks..."
          for script in $(find . -type f -name "*.sh"); do
            echo "Checking syntax for $script"
            bash -n "$script"
          done
