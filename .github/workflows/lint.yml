name: Shell Lint and Syntax Check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  lint:
    name: Lint Bash scripts with ShellCheck + Reviewdog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck with reviewdog (PR annotations)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Running ShellCheck with reviewdog..."
          # Find all shell scripts and lint them
          find . -type f -name "*.sh" \
            | xargs -I{} shellcheck {} -f gcc \
            | reviewdog -f=golint -name="ShellCheck" -reporter=github-pr-review -level=warning

      - name: Run bash syntax check
        run: |
          echo "Running bash syntax checks..."
          find . -type f -name "*.sh" -exec bash -n {} +
